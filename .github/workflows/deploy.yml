name: Deploy Static Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  development:
    name: Development
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Development Test
        run: |
          echo "Development environment"
          echo "Website files checked successfully."


  testing:
    name: Testing
    runs-on: ubuntu-latest
    needs: development
    environment: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Environment Variable
        run: |
          echo "Testing environment"
          echo "Site version: ${{ vars.SITE_VERSION }}"

      - name: Check website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All website files exist."


  production:
    name: Production
    runs-on: ubuntu-latest
    needs: testing
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Production Secret
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          if [ -n "$DEPLOY_SECRET" ]; then
            echo "Production secret is available."
          else
            echo "Production secret is missing."
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
